<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Monitoring dashboard: live CPU, request rate and queue depth graphs, 90-day uptime and a verified nightly backup">
  <style>
    @keyframes up     { from { opacity: 0; transform: translateY(7px) } to { opacity: 1; transform: none } }
    @keyframes grow   { from { transform: scaleX(0) } to { transform: scaleX(1) } }
    @keyframes lit    { from { opacity: 0; transform: scaleY(.2) } to { opacity: 1; transform: none } }
    @keyframes ping   { 0% { transform: scale(1); opacity: .6 } 70%, 100% { transform: scale(3.4); opacity: 0 } }
    /* Les courbes contiennent deux periodes identiques : un defilement de 312 px boucle sans raccord */
    @keyframes scroll { to { transform: translateX(-312px) } }
    @keyframes backup { 0% { transform: scaleX(0); opacity: 1 } 40%, 90% { transform: scaleX(1); opacity: 1 } 96%, 100% { transform: scaleX(1); opacity: 0 } }
    @keyframes run    { 0%, 40% { opacity: 1 } 42%, 94% { opacity: 0 } 98%, 100% { opacity: 1 } }
    @keyframes ok     { 0%, 41% { opacity: 0 } 43%, 90% { opacity: 1 } 96%, 100% { opacity: 0 } }

    .card, .rowin { animation: up .45s cubic-bezier(.2,.7,.3,1) both; }
    .reveal { transform-box: fill-box; transform-origin: left center; animation: grow 1.4s cubic-bezier(.4,0,.2,1) both; }
    .scroll { animation: scroll 14s linear 2s infinite; }
    .ping { transform-box: fill-box; transform-origin: center; animation: ping 2.6s ease-out infinite both; }
    .sq { transform-box: fill-box; transform-origin: center bottom; animation: lit .3s cubic-bezier(.2,.7,.3,1) both; }
    .bk { transform-box: fill-box; transform-origin: left center; animation: backup 10s cubic-bezier(.4,0,.6,1) 1.6s infinite both; }
    .run { animation: run 10s linear 1.6s infinite both; }
    .ok  { animation: ok  10s linear 1.6s infinite both; }

    @media (prefers-reduced-motion: reduce) {
      .card, .rowin, .reveal, .sq, .bk, .ok { animation: none; opacity: 1; transform: none; }
      .scroll { animation: none; }
      .ping, .run { animation: none; opacity: 0; }
    }
  </style>
