<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="tmux session: composer audit, then a Symfony Messenger worker consuming and handling messages from the async transport">
  <style>
    @keyframes type  { from { transform: scaleX(0) } to { transform: scaleX(1) } }
    @keyframes fade  { from { opacity: 0 } to { opacity: 1 } }
    @keyframes up    { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: none } }
    @keyframes crshow { 0% { opacity: 0 } 2%, 96% { opacity: 1 } 100% { opacity: 0 } }
    @keyframes crmove1 { from { transform: translateX(0) } to { transform: translateX(126px) } }
    @keyframes crmove2 { from { transform: translateX(0) } to { transform: translateX(351px) } }
    /* Une ligne de log toutes les 1,5 s, le compteur avance au meme pas */
    @keyframes scroll { to { transform: translateY(-168px) } }
    @keyframes count  { to { transform: translateY(-480px) } }

    .rv { transform-box: fill-box; transform-origin: left center; animation-name: type; animation-fill-mode: both; }
    .c1 { animation-duration: .55s; animation-delay: .30s; animation-timing-function: steps(14, end); }
    .cr1 { animation: crmove1 .55s steps(14, end) .30s both, crshow .55s linear .30s both; }
    .c2 { animation-duration: 1.25s; animation-delay: 1.70s; animation-timing-function: steps(39, end); }
    .cr2 { animation: crmove2 1.25s steps(39, end) 1.70s both, crshow 1.25s linear 1.70s both; }

    .out { animation: fade .35s ease-out both; }
    .o1 { animation-delay: 1.15s } .o2 { animation-delay: 3.20s }
    .p1 { animation: fade .01s linear .30s both }
    .p2 { animation: fade .01s linear 1.70s both }
    .pane { animation: up .5s cubic-bezier(.2,.7,.3,1) both; }
    .q1 { animation-delay: 3.3s } .q2 { animation-delay: 3.45s } .q3 { animation-delay: 3.6s }
    .q4 { animation-delay: 3.75s } .q5 { animation-delay: 3.9s }

    .feed  { animation: scroll 9s steps(6, end) 5s infinite; }
    .units { animation: count 15s steps(10, end) 5s infinite; }
    .tens  { animation: count 150s steps(10, end) -1s infinite; }

    @media (prefers-reduced-motion: reduce) {
      .rv { animation: none; transform: none; }
      .out, .p1, .p2, .pane { animation: none; opacity: 1; transform: none; }
      .cr1, .cr2 { animation: none; opacity: 0; }
      .feed, .units, .tens { animation: none; }
    }
  </style>
  <clipPath id="k1"><rect class="rv c1" x="54" y="72" width="126" height="24"/></clipPath>
  <clipPath id="k2"><rect class="rv c2" x="54" y="144" width="351" height="24"/></clipPath>
  <clipPath id="win"><rect x="40" y="206" width="700" height="114"/></clipPath>
  <clipPath id="ctr"><rect x="790" y="112" width="120" height="48"/></clipPath>

  <rect width="1200" height="360" fill="#10131A"/>
  <rect width="1200" height="44" fill="#191D28"/>
  <circle cx="26" cy="22" r="6" fill="#FFB224"/>
  <circle cx="48" cy="22" r="6" fill="#12A594"/>
  <circle cx="70" cy="22" r="6" fill="#5B5BD6"/>
  <rect x="0" y="43" width="1200" height="1" fill="#2C3242"/>
  <rect x="760" y="44" width="1" height="288" fill="#2C3242"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace" font-size="15">
    <text x="96" y="27" fill="#5A6376" font-size="13">arch — tmux</text>

    <text class="p1" x="32" y="88" fill="#1AC1AE" font-weight="700">&#10095;</text>
    <g clip-path="url(#k1)"><text x="54" y="88" fill="#E6E8EE" textLength="126" lengthAdjust="spacing">composer audit</text></g>
    <rect class="cr1" x="54" y="74" width="9" height="18" fill="#E6E8EE"/>
    <text class="out o1" x="54" y="118" fill="#1AC1AE">No security vulnerability advisories found.</text>

    <text class="p2" x="32" y="160" fill="#1AC1AE" font-weight="700">&#10095;</text>
    <g clip-path="url(#k2)"><text x="54" y="160" fill="#E6E8EE" textLength="351" lengthAdjust="spacing">bin/console messenger:consume async -vv</text></g>
    <rect class="cr2" x="54" y="146" width="9" height="18" fill="#E6E8EE"/>
    <text class="out o2" x="54" y="190"><tspan fill="#1AC1AE">[OK]</tspan><tspan fill="#8891A5">&#160;Consuming messages from transport "async".</tspan></text>

    <g clip-path="url(#win)">
      <g class="feed">
        <g class="out" style="animation-delay:3.60s"><text x="54" y="226" fill="#E6E8EE">OrderPlaced</text><text x="250" y="226" fill="#1AC1AE">&#10003;&#160;handled</text><text x="450" y="226" fill="#FFB224" text-anchor="end">12&#160;ms</text></g>
        <g class="out" style="animation-delay:3.85s"><text x="54" y="254" fill="#E6E8EE">PaymentCaptured</text><text x="250" y="254" fill="#1AC1AE">&#10003;&#160;handled</text><text x="450" y="254" fill="#FFB224" text-anchor="end">31&#160;ms</text></g>
        <g class="out" style="animation-delay:4.10s"><text x="54" y="282" fill="#E6E8EE">InvoiceGenerated</text><text x="250" y="282" fill="#1AC1AE">&#10003;&#160;handled</text><text x="450" y="282" fill="#FFB224" text-anchor="end">38&#160;ms</text></g>
        <g class="out" style="animation-delay:4.35s"><text x="54" y="310" fill="#E6E8EE">StockReserved</text><text x="250" y="310" fill="#1AC1AE">&#10003;&#160;handled</text><text x="450" y="310" fill="#FFB224" text-anchor="end">7&#160;ms</text></g>
        <g><text x="54" y="338" fill="#E6E8EE">ShipmentScheduled</text><text x="250" y="338" fill="#1AC1AE">&#10003;&#160;handled</text><text x="450" y="338" fill="#FFB224" text-anchor="end">19&#160;ms</text></g>
        <g><text x="54" y="366" fill="#E6E8EE">CustomerNotified</text><text x="250" y="366" fill="#1AC1AE">&#10003;&#160;handled</text><text x="450" y="366" fill="#FFB224" text-anchor="end">5&#160;ms</text></g>
        <g><text x="54" y="394" fill="#E6E8EE">OrderPlaced</text><text x="250" y="394" fill="#1AC1AE">&#10003;&#160;handled</text><text x="450" y="394" fill="#FFB224" text-anchor="end">12&#160;ms</text></g>
        <g><text x="54" y="422" fill="#E6E8EE">PaymentCaptured</text><text x="250" y="422" fill="#1AC1AE">&#10003;&#160;handled</text><text x="450" y="422" fill="#FFB224" text-anchor="end">31&#160;ms</text></g>
        <g><text x="54" y="450" fill="#E6E8EE">InvoiceGenerated</text><text x="250" y="450" fill="#1AC1AE">&#10003;&#160;handled</text><text x="450" y="450" fill="#FFB224" text-anchor="end">38&#160;ms</text></g>
        <g><text x="54" y="478" fill="#E6E8EE">StockReserved</text><text x="250" y="478" fill="#1AC1AE">&#10003;&#160;handled</text><text x="450" y="478" fill="#FFB224" text-anchor="end">7&#160;ms</text></g>
        <g><text x="54" y="506" fill="#E6E8EE">ShipmentScheduled</text><text x="250" y="506" fill="#1AC1AE">&#10003;&#160;handled</text><text x="450" y="506" fill="#FFB224" text-anchor="end">19&#160;ms</text></g>
        <g><text x="54" y="534" fill="#E6E8EE">CustomerNotified</text><text x="250" y="534" fill="#1AC1AE">&#10003;&#160;handled</text><text x="450" y="534" fill="#FFB224" text-anchor="end">5&#160;ms</text></g>
      </g>
    </g>

    <text class="pane q1" x="800" y="84" fill="#5A6376" font-size="12" letter-spacing="2">WORKER · ASYNC</text>
    <g class="pane q2" fill="#FBFBFD" font-size="40" font-weight="700">
      <text x="812" y="148" text-anchor="middle">1</text>
      <text x="838" y="148" text-anchor="middle">2</text>
      <g clip-path="url(#ctr)"><g class="tens"><text x="864" y="148" text-anchor="middle">0</text><text x="864" y="196" text-anchor="middle">1</text><text x="864" y="244" text-anchor="middle">2</text><text x="864" y="292" text-anchor="middle">3</text><text x="864" y="340" text-anchor="middle">4</text><text x="864" y="388" text-anchor="middle">5</text><text x="864" y="436" text-anchor="middle">6</text><text x="864" y="484" text-anchor="middle">7</text><text x="864" y="532" text-anchor="middle">8</text><text x="864" y="580" text-anchor="middle">9</text></g><g class="units"><text x="890" y="148" text-anchor="middle">4</text><text x="890" y="196" text-anchor="middle">5</text><text x="890" y="244" text-anchor="middle">6</text><text x="890" y="292" text-anchor="middle">7</text><text x="890" y="340" text-anchor="middle">8</text><text x="890" y="388" text-anchor="middle">9</text><text x="890" y="436" text-anchor="middle">0</text><text x="890" y="484" text-anchor="middle">1</text><text x="890" y="532" text-anchor="middle">2</text><text x="890" y="580" text-anchor="middle">3</text></g></g>
    </g>
    <text class="pane q2" x="800" y="182" fill="#8891A5" font-size="13">messages handled</text>
    <g class="pane q3" font-size="14"><text x="800" y="226" fill="#8891A5">failed</text><text x="1160" y="226" fill="#1AC1AE" text-anchor="end">0</text></g>
    <g class="pane q4" font-size="14"><text x="800" y="258" fill="#8891A5">memory</text><text x="1160" y="258" fill="#E6E8EE" text-anchor="end">18.4 MB</text></g>
    <g class="pane q5" font-size="14"><text x="800" y="290" fill="#8891A5">uptime</text><text x="1160" y="290" fill="#E6E8EE" text-anchor="end">3d 04h</text></g>

    <rect x="0" y="332" width="1200" height="28" fill="#191D28"/>
    <rect x="0" y="332" width="1200" height="1" fill="#2C3242"/>
    <rect x="0" y="333" width="72" height="27" fill="#12A594"/>
    <text x="36" y="351" fill="#10131A" font-size="13" font-weight="700" text-anchor="middle">arch</text>
    <text x="90" y="351" font-size="13"><tspan fill="#8891A5">0:zsh&#160;&#160;</tspan><tspan fill="#FFB224">1:consume*</tspan></text>
    <text x="1180" y="351" fill="#5A6376" font-size="13" text-anchor="end">web-01 · 14:32</text>
  </g>
</svg>
