<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-label="Alexandre Romagnoli, Backend Engineer, PHP and Symfony">
  <style>
    @keyframes rise { from { opacity: 0; transform: translateY(16px) } to { opacity: 1; transform: none } }
    @keyframes up   { from { opacity: 0; transform: translateY(6px) }  to { opacity: 1; transform: none } }
    @keyframes grow { from { transform: scaleX(0) } to { transform: scaleX(1) } }

    /* Cascade du profiler : cycle partage de 5 s, la tete de lecture parcourt 42 ms en 60 % du cycle */
    @keyframes w0 { 0%, 0.0% { transform: scaleX(0) } 60.0%, 100% { transform: scaleX(1) } }
    @keyframes w1 { 0%, 2.9% { transform: scaleX(0) } 10.0%, 100% { transform: scaleX(1) } }
    @keyframes w2 { 0%, 10.0% { transform: scaleX(0) } 51.4%, 100% { transform: scaleX(1) } }
    @keyframes w3 { 0%, 14.3% { transform: scaleX(0) } 34.3%, 100% { transform: scaleX(1) } }
    @keyframes w4 { 0%, 35.7% { transform: scaleX(0) } 41.4%, 100% { transform: scaleX(1) } }
    @keyframes w5 { 0%, 42.9% { transform: scaleX(0) } 54.3%, 100% { transform: scaleX(1) } }
    @keyframes head {
      0%        { transform: translateX(0);     opacity: 0 }
      2%        { transform: translateX(9.7px); opacity: 1 }
      60%       { transform: translateX(290px); opacity: 1 }
      66%, 100% { transform: translateX(290px); opacity: 0 }
    }
    @keyframes cyc  { 0%, 90% { opacity: 1 } 96%, 100% { opacity: 0 } }
    @keyframes done { 0%, 60% { opacity: 0 } 63%, 90% { opacity: 1 } 96%, 100% { opacity: 0 } }

    .t  { animation: rise .75s cubic-bezier(.2,.7,.3,1) both; }
    .t1 { animation-delay: .05s } .t2 { animation-delay: .20s } .t3 { animation-delay: .35s }
    .row, .axis { animation: up .5s cubic-bezier(.2,.7,.3,1) both; }
    .axis { animation-delay: .75s }

    .w { transform-box: fill-box; transform-origin: left center;
         animation-duration: 5s; animation-delay: 1.2s; animation-iteration-count: infinite;
         animation-timing-function: linear; animation-fill-mode: both; }
    .w0 { animation-name: w0 } .w1 { animation-name: w1 } .w2 { animation-name: w2 } .w3 { animation-name: w3 } .w4 { animation-name: w4 } .w5 { animation-name: w5 }
    .cyc  { animation: cyc  5s linear 1.2s infinite both; }
    .head { animation: head 5s linear 1.2s infinite both; }
    .done { animation: done 5s linear 1.2s infinite both; }

    .ruler { transform-box: fill-box; transform-origin: left center; animation: grow 1.1s cubic-bezier(.2,.7,.3,1) .1s both; }
    .bar { transform-box: fill-box; transform-origin: left center; animation: grow .65s cubic-bezier(.2,.7,.3,1) both; }
    .r1 { animation-delay: .10s } .r2 { animation-delay: .24s }
    .r3 { animation-delay: .38s } .r4 { animation-delay: .52s }

    @media (prefers-reduced-motion: reduce) {
      .t, .row, .axis, .ruler, .bar, .w, .cyc, .done { animation: none; opacity: 1; transform: none; }
      .head { animation: none; opacity: 0; }
    }
  </style>
  <defs>
    <pattern id="tick" x="0" y="262" width="100" height="14" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="2" height="14" fill="#2C3242"/>
      <rect x="20" y="8" width="2" height="6" fill="#2C3242"/>
      <rect x="40" y="8" width="2" height="6" fill="#2C3242"/>
      <rect x="60" y="8" width="2" height="6" fill="#2C3242"/>
      <rect x="80" y="8" width="2" height="6" fill="#2C3242"/>
    </pattern>
    <clipPath id="reveal"><rect class="ruler" x="0" y="262" width="1200" height="14"/></clipPath>
  </defs>
  <rect width="1200" height="280" fill="#10131A"/>

  <g font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">
    <text class="t t1" x="80" y="118" fill="#FBFBFD" font-size="58" font-weight="700" letter-spacing="-1">Alexandre Romagnoli</text>
    <text class="t t2" x="80" y="164" fill="#8B87F0" font-size="26" font-weight="600">Backend Engineer — PHP / Symfony</text>
    <text class="t t3" x="80" y="200" fill="#9AA1B2" font-size="19">4+ years building server-side systems</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace">
    <text class="row" x="750" y="63" fill="#E6E8EE" font-size="14"><tspan fill="#6E6AE0" font-weight="700">GET</tspan>&#160;/api/orders</text>
    <g class="row" style="animation-delay:0.30s"><text x="750" y="96" fill="#8891A5" font-size="13">kernel</text><rect x="860" y="84" width="290" height="14" fill="#1A1E29"/></g>
    <g class="row" style="animation-delay:0.37s"><text x="750" y="122" fill="#8891A5" font-size="13">security</text><rect x="860" y="110" width="290" height="14" fill="#1A1E29"/></g>
    <g class="row" style="animation-delay:0.44s"><text x="750" y="148" fill="#8891A5" font-size="13">controller</text><rect x="860" y="136" width="290" height="14" fill="#1A1E29"/></g>
    <g class="row" style="animation-delay:0.51s"><text x="750" y="174" fill="#8891A5" font-size="13">doctrine</text><rect x="860" y="162" width="290" height="14" fill="#1A1E29"/></g>
    <g class="row" style="animation-delay:0.58s"><text x="750" y="200" fill="#8891A5" font-size="13">redis</text><rect x="860" y="188" width="290" height="14" fill="#1A1E29"/></g>
    <g class="row" style="animation-delay:0.65s"><text x="750" y="226" fill="#8891A5" font-size="13">serializer</text><rect x="860" y="214" width="290" height="14" fill="#1A1E29"/></g>
    <g class="cyc">
      <rect class="w w0" x="860.0" y="84" width="290.0" height="14" fill="#6E6AE0"/>
      <rect class="w w1" x="873.8" y="110" width="34.5" height="14" fill="#5A6376"/>
      <rect class="w w2" x="908.3" y="136" width="200.2" height="14" fill="#9C99F5"/>
      <rect class="w w3" x="929.0" y="162" width="96.7" height="14" fill="#1AC1AE"/>
      <rect class="w w4" x="1032.6" y="188" width="27.6" height="14" fill="#FFB224"/>
      <rect class="w w5" x="1067.1" y="214" width="55.2" height="14" fill="#5A6376"/>
    </g>
    <rect class="head" x="859" y="78" width="2" height="156" fill="#FFB224"/>
    <g class="done">
      <rect x="1030" y="46" width="120" height="24" fill="#FFB224"/>
      <text x="1090" y="63" fill="#10131A" font-size="13" font-weight="700" text-anchor="middle">200 · 42 ms</text>
    </g>
    <g class="axis" fill="#8891A5" font-size="11"><rect x="859.5" y="238" width="1" height="5" fill="#2C3242"/><text x="860.0" y="256" text-anchor="middle">0</text><rect x="928.5" y="238" width="1" height="5" fill="#2C3242"/><text x="929.0" y="256" text-anchor="middle">10</text><rect x="997.6" y="238" width="1" height="5" fill="#2C3242"/><text x="998.1" y="256" text-anchor="middle">20</text><rect x="1066.6" y="238" width="1" height="5" fill="#2C3242"/><text x="1067.1" y="256" text-anchor="middle">30</text><rect x="1135.7" y="238" width="1" height="5" fill="#2C3242"/><text x="1136.2" y="256" text-anchor="middle">40 ms</text></g>
  </g>

  <rect x="0" y="262" width="1200" height="14" fill="url(#tick)" clip-path="url(#reveal)"/>
  <rect class="bar r1" x="0"    y="276" width="720" height="4" fill="#6E6AE0"/>
  <rect class="bar r2" x="720"  y="276" width="280" height="4" fill="#1AC1AE"/>
  <rect class="bar r3" x="1000" y="276" width="120" height="4" fill="#FFB224"/>
  <rect class="bar r4" x="1120" y="276" width="80"  height="4" fill="#5A6376"/>
</svg>
